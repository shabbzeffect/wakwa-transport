<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search | WAKWA</title><link rel="icon" href="assets/img/favicon.svg"><link rel="stylesheet" href="assets/css/styles.css"><script src="https://cdn.tailwindcss.com"></script></head><body>
<main><div class="container section" style="max-width:760px"><p class="eyebrow">Search</p><h1>FIND IT FAST.</h1>
<input id="q" class="field" placeholder="tipper, sand, slab, border…" aria-label="Search"><div id="out" style="display:grid;gap:10px;margin-top:12px"></div></div></main>
<script src="content/site.js"></script><script src="content/data.js"></script><script src="content/services.js"></script><script src="assets/js/site.js"></script>
<script>WAKWA_MOUNT('blog.html');
function go(f){const idx=[...WAKWA_SERVICES.map(s=>({t:s.title,d:s.short,h:`service-detail.html?slug=${s.slug}`})),...WAKWA_MATERIALS.map(m=>({t:m.name,d:m.note,h:'supply.html'})),...WAKWA_POSTS.map(p=>({t:p.title,d:p.ex,h:`blog-post.html?slug=${p.slug}`}))];
out.innerHTML=idx.filter(x=>(x.t+x.d).toLowerCase().includes(f.toLowerCase())).slice(0,12).map(x=>`<a class="card" style="padding:14px;text-decoration:none;color:inherit" href="${x.h}"><b>${x.t}</b><br><small>${x.d}</small></a>`).join('')||'<p>No matches. Try “tipper” or “sand”.</p>';}
q.oninput=e=>go(e.target.value);q.value=new URLSearchParams(location.search).get('q')||'';go(q.value);</script></body></html>
