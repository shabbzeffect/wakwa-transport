<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet | WAKWA — Tippers, Trailers, Low-beds, Tankers</title><meta name="description" content="Filterable fleet: tippers 7–30T, flatbeds, low-beds, box trucks, reefers, tankers, skips, vans and plant hire with specs.">
<link rel="icon" href="assets/img/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/styles.css"></head><body>
<a class="skip" href="#main">Skip to content</a><main id="main"><div class="container section">
<p class="eyebrow">Fleet</p><h1 style="font-size:clamp(36px,5vw,64px)">HEAVY METAL, READY.</h1>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0" id="filters"></div>
<div id="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"></div></div></main>
<script src="content/site.js"></script><script src="content/data.js"></script><script src="assets/js/site.js"></script>
<script>WAKWA_MOUNT('fleet.html');
const cats=['All','Tipper','Trailer / Low-bed','Box / Van','Tanker / Special','Plant'];
filters.innerHTML=cats.map((c,i)=>`<button class="btn ${i===0?'btn-amber':'btn-outline'}" data-f="${c}" style="padding:8px 14px">${c}</button>`).join('');
function match(f,cat){if(cat==='All')return true;if(cat==='Tipper')return f.id.includes('tipper');if(cat==='Trailer / Low-bed')return['flatbed','lowbed','hooklift'].includes(f.id);if(cat==='Box / Van')return['box','van','reefer'].includes(f.id);if(cat==='Tanker / Special')return['tanker','skip'].includes(f.id);return f.id==='plant';}
function fleetPic(id){ if(id.includes('tipper')||id==='tanker'||id==='flatbed')return 'assets/img/fleet-highway.jpg'; if(id==='lowbed'||id==='plant')return 'assets/img/fleet-plant.jpg'; return 'assets/img/fleet-warehouse.jpg'; }
function render(cat='All'){grid.innerHTML=WAKWA_FLEET.filter(f=>match(f,cat)).map(f=>`<div class="card card-hover" style="padding:20px"><img src="${fleetPic(f.id)}" alt="${f.name} (demo photo)" width="1000" height="667" loading="lazy" decoding="async" style="margin:-20px -20px 0;width:calc(100% + 40px);height:170px;object-fit:cover;border-radius:13px 13px 0 0"><div class="fleet-band"><span class="badge" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)">${f.avail}</span><h2>${f.name}</h2><div class="cap tabular">${f.cap}</div></div><table class="spec"><tr><th>Axle</th><td>${f.axle}</td></tr><tr><th>Bed</th><td>${f.bed}</td></tr><tr><th>Best for</th><td>${f.use}</td></tr></table><a class="btn btn-amber" style="margin-top:8px" href="quote.html?truck=${f.id}">Book this type</a></div>`).join('');}
filters.onclick=e=>{const b=e.target.closest('button');if(!b)return;[...filters.children].forEach(x=>x.className='btn btn-outline');b.className='btn btn-amber';render(b.dataset.f);};render();
function fit(){grid.style.gridTemplateColumns=innerWidth<800?'1fr':innerWidth<1100?'1fr 1fr':'repeat(3,1fr)'}addEventListener('resize',fit);fit();</script></body></html>
