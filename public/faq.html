<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAQ | WAKWA</title><meta name="description" content="25 answers: pricing, insurance, payments, cancellation, off-road, cross-border, claims, lead times.">
<link rel="icon" href="assets/img/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/styles.css"></head><body>
<a class="skip" href="#main">Skip to content</a><main id="main"><div class="container section" style="max-width:820px">
<p class="eyebrow">FAQ</p><h1 style="font-size:clamp(36px,5vw,60px)">STRAIGHT ANSWERS.</h1>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0" id="cats"></div>
<div id="list" style="display:grid;gap:10px"></div></div></main>
<script src="content/site.js"></script><script src="content/data.js"></script><script src="assets/js/site.js"></script>
<script>WAKWA_MOUNT('faq.html');
const cats=[...new Set(WAKWA_FAQS.map(f=>f.c))];
cats.unshift('All');catsEl=cats;document.getElementById('cats').innerHTML=cats.map((c,i)=>`<button class="btn ${i===0?'btn-amber':'btn-outline'}" data-c="${c}" style="padding:6px 12px">${c}</button>`).join('');
function render(cat='All'){const items=WAKWA_FAQS.filter(f=>cat==='All'||f.c===cat);
list.innerHTML=items.map(f=>`<div class="accordion-item"><button class="accordion-btn" aria-expanded="false">${f.q}<span>+</span></button><div class="accordion-panel"><p>${f.a}</p></div></div>`).join('');
$$('.accordion-btn').forEach(b=>b.onclick=()=>{const it=b.parentElement,o=it.classList.contains('open');$$('.accordion-item').forEach(x=>{x.classList.remove('open');x.querySelector('.accordion-panel').style.maxHeight=null;x.querySelector('.accordion-btn').setAttribute('aria-expanded','false')});if(!o){it.classList.add('open');const p=it.querySelector('.accordion-panel');p.style.maxHeight=p.scrollHeight+'px';b.setAttribute('aria-expanded','true');}});
const jd={"@context":"https://schema.org","@type":"FAQPage","mainEntity":items.slice(0,10).map(f=>({"@type":"Question","name":f.q,"acceptedAnswer":{"@type":"Answer","text":f.a}}))};const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(jd);document.head.appendChild(s);}
document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.children].forEach(x=>x.className='btn btn-outline');b.className='btn btn-amber';render(b.dataset.c);};render();</script></body></html>
