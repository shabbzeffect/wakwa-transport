<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Services | WAKWA Supply & Transportation</title><meta name="description" content="14 haulage, supply and heavy-lift services. Construction materials, cross-border, low-beds, containers, water, fuel, agri, 3PL and more.">
<link rel="icon" href="assets/img/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/styles.css"></head><body>
<a class="skip" href="#main">Skip to content</a><main id="main"><div class="container section">
<p class="eyebrow">Services</p><h1 style="font-size:clamp(36px,5vw,64px)">EVERY LOAD HAS A TRUCK.</h1>
<p style="max-width:70ch">Short town shuttles to cross-border convoys. Pick a service — each page lists what's included, ideal cargo, fleet used, process and pricing factors.</p>
<input id="q" class="field" placeholder="Search services… (e.g. tipper, container, water)" aria-label="Search services" style="max-width:480px;margin:14px 0">
<div id="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"></div>
</div></main>
<script src="content/site.js"></script><script src="content/data.js"></script><script src="content/services.js"></script><script src="assets/js/site.js"></script>
<script>WAKWA_MOUNT('services.html');
function render(f=''){grid.innerHTML=WAKWA_SERVICES.filter(s=>(s.title+s.body).toLowerCase().includes(f.toLowerCase())).map(s=>`<a class="card card-hover svc-card" href="service-detail.html?slug=${s.slug}" style="padding:20px;text-decoration:none;color:inherit"><div style="font-size:30px">${s.icon}</div><h2 style="font-size:26px">${s.title}</h2><p style="color:var(--muted)">${s.body.slice(0,140)}…</p><span style="font-weight:800">Open →</span></a>`).join('');}
q.oninput=e=>render(e.target.value);render();
function fit(){grid.style.gridTemplateColumns=innerWidth<800?'1fr':innerWidth<1100?'1fr 1fr':'repeat(3,1fr)'}addEventListener('resize',fit);fit();</script></body></html>
